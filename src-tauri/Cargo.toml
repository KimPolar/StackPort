[package]
name = "stackport"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.16"
serde = { version = "1.0", features = ["derive"] }
stackport-core = { path = "../crates/stackport-core" }
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
