[package]
name = "stackport-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
portable-pty = "=0.8.1"
russh = { version = "0.65.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = { version = "4.0.0", features = ["raw-string"] }
rusqlite = { version = "0.32.1", features = ["backup", "bundled", "hooks"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.0", features = ["v4"] }
zeroize = "1.9"
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5"
native-tls = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading"] }
