[package]
name = "stackport-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
bytes = "1"
encoding_rs = "0.8"
flate2 = "1"
futures-util = { version = "0.3", default-features = false }
portable-pty = "=0.8.1"
russh = { version = "0.65.3", default-features = false, features = ["ring", "rsa"] }
russh-sftp = { version = "4.0.0", features = ["raw-string"] }
rusqlite = { version = "0.32.1", features = ["backup", "bundled", "hooks"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
url = "2.5.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
zeroize = "1.9"
tokio-postgres = "0.7.18"
postgres-native-tls = "0.5"
native-tls = "0.2"
tokio-native-tls = "0.3"
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "tls12"] }
mongodb = { version = "=3.10.2", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver", "redact-errors"] }
bson = { version = "3.1", features = ["serde_json-1"] }
tiberius = { version = "=0.13.0", features = ["chrono"] }
chrono = { version = "0.4", default-features = false }
oracledb = "=26.0.0-beta.6"
reqwest = { version = "=0.13.5", default-features = false, features = ["gzip", "json", "native-tls", "system-proxy"] }
tokio-util = { version = "0.7", features = ["compat"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"

[dev-dependencies]
rcgen = "0.14.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
aws-lc-sys = { version = "0.47", features = ["prebuilt-nasm"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinHttp", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }
